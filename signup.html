function applyTranslations(l) {
  document.documentElement.lang = l;
  document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';

  document.getElementById('successMsg').textContent = t.successMsg;
  document.getElementById('submitBtn').textContent = t.submitBtn;

  setPasswordToggleLabels(t.showPassword, t.hidePassword);
}

// ---------- Email typo check ----------
// A domain one or two letters away from a popular provider is probably a typo (gmil.com → gmail.com).
const COMMON_DOMAINS = [
    "gmail.com", "hotmail.com", "outlook.com", "yahoo.com", "icloud.com", "live.com",
    "aol.com", "msn.com", "outlook.sa", "hotmail.co.uk", "yahoo.co.uk", "protonmail.com", "proton.me"
];
// Real providers that look close to the ones above and must not be "corrected".
const REAL_DOMAINS = new Set([
    "mail.com", "gmx.com", "ymail.com", "me.com", "mac.com", "email.com", "googlemail.com",
    "live.co.uk", "hotmail.fr", "yahoo.fr", "outlook.fr", "hotmail.de", "yahoo.de", "outlook.de"
]);

function editDistance(a, b) {
    const row = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
        let prev = row[0];
        row[0] = i;
        for (let j = 1; j <= b.length; j++) {
            const cur = row[j];
            row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
            prev = cur;
        }
    }
    return row[b.length];
}

// Returns the corrected email, or null when the domain looks fine.
function suggestEmail(email) {
    const at = email.lastIndexOf("@");
    if (at < 1) return null;
    const domain = email.slice(at + 1).toLowerCase();
    if (COMMON_DOMAINS.includes(domain) || REAL_DOMAINS.has(domain)) return null;
    let best = null, bestDistance = 3;
    for (const d of COMMON_DOMAINS) {
        const dist = editDistance(domain, d);
        if (dist < bestDistance) { bestDistance = dist; best = d; }
    }
    return best ? email.slice(0, at + 1) + best : null;
}

const emailInput = document.getElementById('email');
const suggestBox = document.getElementById('emailSuggest');
let typoWarnedFor = "";

function showEmailSuggestion() {
    const lang = localStorage.getItem('lang') || 'en';
    const t = i18n[lang];
    const fixed = suggestEmail(emailInput.value.trim());
    if (!fixed) { suggestBox.style.display = 'none'; return null; }
    suggestBox.textContent = `${t.didYouMean} ${fixed}${lang === 'ar' ? '؟' : '?'}`;
    const useBtn = document.createElement('button');
    useBtn.type = 'button';
    useBtn.textContent = t.useIt;
    useBtn.onclick = () => { emailInput.value = fixed; suggestBox.style.display = 'none'; emailInput.focus(); };
    suggestBox.appendChild(useBtn);
    suggestBox.style.display = 'block';
    return fixed;
}
emailInput.addEventListener('blur', showEmailSuggestion);
emailInput.addEventListener('input', () => { suggestBox.style.display = 'none'; });

// Turns a Supabase signUp error into one of our translated messages.
function friendlySignupError(error, t) {
    const msg = error.message || '';
    if (msg.includes('profiles_fullname_unique_idx') || msg.includes('duplicate key')) return t.usernameExists;
    if (error.code === 'user_already_exists' || msg.includes('already registered')) return t.emailExists;
    if (error.code === 'weak_password' || /password should be/i.test(msg)) return t.passwordLength;
    if (error.code === 'email_address_invalid' || /invalid.*email|email.*invalid/i.test(msg)) return t.invalidEmail;
    if (error.status === 429 || /rate limit|too many/i.test(msg)) return t.tooManyAttempts;
    if (error.name === 'AuthRetryableFetchError' || /failed to fetch|network/i.test(msg)) return t.networkError;
    return t.sendError;
}

let signupInFlight = false;

async function handleSignup(e) {
    e.preventDefault();
    if (signupInFlight) return false;
    const fullname = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const submitBtn = document.getElementById('submitBtn');
    const lang = localStorage.getItem('lang') || 'en';
    const t = i18n[lang];

    const showError = text => {
        errorMsg.textContent = text;
        errorMsg.style.display = 'block';
        return false;
    };

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!fullname || !email || !password || !confirmPassword) return showError(t.fillAllFields);
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError(t.invalidEmail);
    if (password.length < 6) return showError(t.passwordLength);
    if (password !== confirmPassword) return showError(t.passwordMismatch);

    // Looks like a typo (e.g. @gmil.com): stop once and suggest the fix. Pressing again with the same email goes through.
    if (showEmailSuggestion() && typoWarnedFor !== email) {
        typoWarnedFor = email;
        return showError(t.typoAgain);
    }

    signupInFlight = true;
    setBusy(submitBtn, true, t.checking);
    const resetButton = () => {
        signupInFlight = false;
        setBusy(submitBtn, false, t.submitBtn);
    };

    try {
        const { data: existingProfile, error: usernameCheckError } = await supabaseClient
            .from('profiles')
            .select('id')
            .ilike('fullname', fullname)
            .maybeSingle();

        if (usernameCheckError) {
            console.error(usernameCheckError);
            resetButton();
            return showError(t.sendError);
        }

        if (existingProfile) {
            resetButton();
            document.getElementById('fullname').focus();
            return showError(t.usernameExists);
        }

        setBusy(submitBtn, true, t.sendingCode);

        // Supabase creates the account and emails the 6-digit code itself.
        // With "Confirm email" turned on, the account can't log in until that code is entered.
        const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { fullname } }
        });

        if (signUpError) {
            resetButton();
            return showError(friendlySignupError(signUpError, t));
        }

        // When confirmation is on, Supabase doesn't say if an email is taken; it returns a user with no identities instead.
        const identities = signUpData?.user?.identities;
        if (Array.isArray(identities) && identities.length === 0) {
            resetButton();
            return showError(t.emailExists);
        }

        // Logged in straight away means "Confirm email" is still off in Supabase, so there's no code to enter.
        if (signUpData?.session) {
            window.location.href = 'index.html';
            return false;
        }

        // Only what the next page needs to show; never the password.
        sessionStorage.setItem('bb_pending_user', JSON.stringify({ email, fullname, sentAt: Date.now() }));
        successMsg.textContent = t.successMsg;
        successMsg.style.display = 'block';
        setTimeout(() => { window.location.href = 'verify.html'; }, 900);
    } catch (err) {
        console.error(err);
        resetButton();
        showError(t.networkError);
    }
    return false;
}
