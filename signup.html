<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إنشاء حساب جديد — Brain Battle</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #f4f6f9;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .top-header {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 9999;
    }

    .back-btn {
        background-color: #e2e8f0;
        color: #1e293b;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: bold;
        text-decoration: none;
        display: inline-block;
    }

    .back-btn:hover {
        background-color: #cbd5e1;
    }

    .login-wrapper {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .login-card {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 400px;
    }

    .login-card h2 {
        color: #1e293b;
        margin-bottom: 8px;
        font-size: 24px;
    }

    .subtitle {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 24px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-size: 14px;
        font-weight: 500;
    }

    .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
    }

    .input-group input:focus {
        border-color: #2563eb;
    }

    .hint {
        color: #94a3b8;
        font-size: 12px;
        margin-top: 6px;
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-top: 4px;
    }

    .btn-submit:hover {
        background-color: #1d4ed8;
    }

    .btn-submit:disabled {
        background-color: #93b4f2;
        cursor: not-allowed;
    }

    .error-msg {
        color: #dc2626;
        font-size: 13px;
        margin-top: -12px;
        margin-bottom: 16px;
        display: none;
    }

    .success-msg {
        color: #16a34a;
        font-size: 13px;
        margin-top: -12px;
        margin-bottom: 16px;
        display: none;
    }

    .footer-link {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #64748b;
    }

    .footer-link a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
    }

    .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid #ffffff88;
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin .7s linear infinite;
        vertical-align: middle;
        margin-left: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="top-header">
    <a href="Fk it.html" class="back-btn">رجوع</a>
    <a href="verify.html" class="btn-submit">انشاء الحساب</a>
</header>

<div class="login-wrapper">
    <div class="login-card">
        <h2>🧠 إنشاء حساب جديد</h2>
        <p class="subtitle">انضم إلى Brain Battle وابدأ التحدي</p>

        <form id="signupForm" onsubmit="return handleSignup(event)">
            <div class="input-group">
                <label for="fullname">الاسم</label>
                <input type="text" id="fullname" placeholder="مثلاً Rayan" maxlength="18" required>
            </div>

            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>

            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <div class="hint">6 أحرف على الأقل</div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">تأكيد كلمة المرور</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required>
            </div>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg">تم إرسال كود التحقق إلى إيميلك! جارٍ تحويلك...</div>

            <button type="submit" class="btn-submit" id="submitBtn">إنشاء الحساب</button>
        </form>

        <div class="footer-link">
            لديك حساب بالفعل؟ <a href="login.html">سجّل دخولك</a>
        </div>
    </div>
</div>

<script>
const EMAILJS_PUBLIC_KEY  = "YOUR_PUBLIC_KEY";
const EMAILJS_SERVICE_ID  = "YOUR_SERVICE_ID";
const EMAILJS_TEMPLATE_ID = "YOUR_TEMPLATE_ID";

if (window.emailjs) emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

function generateCode() {
    return String(Math.floor(100000 + Math.random() * 900000)); // كود من 6 أرقام
}

async function handleSignup(e) {
    e.preventDefault();
    const fullname = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const submitBtn = document.getElementById('submitBtn');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!fullname || !email || !password || !confirmPassword) {
        errorMsg.textContent = 'يرجى تعبئة جميع الحقول';
        errorMsg.style.display = 'block';
        return false;
    }

    if (password.length < 6) {
        errorMsg.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
        errorMsg.style.display = 'block';
        return false;
    }

    if (password !== confirmPassword) {
        errorMsg.textContent = 'كلمتا المرور غير متطابقتين';
        errorMsg.style.display = 'block';
        return false;
    }

    const users = JSON.parse(localStorage.getItem('bb_users') || '[]');
    if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
        errorMsg.textContent = 'هذا الإيميل مسجل بحساب موجود بالفعل';
        errorMsg.style.display = 'block';
        return false;
    }

    const code = generateCode();
    const pendingUser = {
        fullname, email, password, code,
        createdAt: Date.now(),
        expiresAt: Date.now() + 5 * 60 * 1000 
    };

    submitBtn.disabled = true;
    submitBtn.innerHTML = 'جارٍ إرسال الكود<span class="spinner"></span>';

    try {
        if (!window.emailjs || EMAILJS_PUBLIC_KEY === "YOUR_PUBLIC_KEY") {
            throw new Error('EmailJS غير مُعد بعد');
        }
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
            to_name: fullname,
            to_email: email,
            code: code
        });

        sessionStorage.setItem('bb_pending_user', JSON.stringify(pendingUser));
        successMsg.style.display = 'block';
        setTimeout(() => { window.location.href = 'verify.html'; }, 900);
    } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'إنشاء الحساب';
        errorMsg.textContent = 'تعذّر إرسال كود التحقق. تأكد من إعداد EmailJS ثم حاول مرة أخرى.';
        errorMsg.style.display = 'block';
        console.error(err);
    }

    return false;
}
</script>

</body>
</html>
