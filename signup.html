<script>

</script>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #f4f6f9;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .top-header {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 9999;
    }

    .back-btn {
        background-color: #e2e8f0;
        color: #1e293b;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: bold;
        text-decoration: none;
        display: inline-block;
    }

    .back-btn:hover {
        background-color: #cbd5e1;
    }

    .login-wrapper {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .login-card {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 400px;
    }

    .login-card h2 {
        color: #1e293b;
        margin-bottom: 8px;
        font-size: 24px;
    }

    .subtitle {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 24px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-size: 14px;
        font-weight: 500;
    }

    .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
    }

    .input-group input:focus {
        border-color: #2563eb;
    }

    .hint {
        color: #94a3b8;
        font-size: 12px;
        margin-top: 6px;
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-top: 4px;
    }

    .btn-submit:hover {
        background-color: #1d4ed8;
    }

    .btn-submit:disabled {
        background-color: #93b4f2;
        cursor: not-allowed;
    }

    .error-msg {
        color: #dc2626;
        font-size: 13px;
        margin-top: -12px;
        margin-bottom: 16px;
        display: none;
    }

    .success-msg {
        color: #16a34a;
        font-size: 13px;
        margin-top: -12px;
        margin-bottom: 16px;
        display: none;
    }

    .footer-link {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #64748b;
    }

    .footer-link a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
    }

    .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid #ffffff88;
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin .7s linear infinite;
        vertical-align: middle;
        margin-left: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="top-header">
    <a href="index.html" class="back-btn" id="BackBtn">رجوع</a>
</header>

<div class="login-wrapper">
    <div class="login-card">
        <h2 id="TtlSignup">🧠 إنشاء حساب جديد</h2>
        <p class="subtitle" id="SubTtl">انضم إلى Brain Battle وابدأ التحدي</p>

        <form id="signupForm" onsubmit="return handleSignup(event)">
            <div class="input-group">
                <label for="fullname" id="usernameText">الاسم</label>
                <input type="text" id="fullname" placeholder="مثلاً vliex" maxlength="18" required>
            </div>

            <div class="input-group">
                <label for="email" id="EmailText">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>

            <div class="input-group">
                <label for="password" id="PasswordText">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <div class="hint">6 أحرف على الأقل</div>
            </div>

            <div class="input-group">
                <label for="confirmPassword" id="ConfirmPasswordText">تأكيد كلمة المرور</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required>
            </div>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg">تم إرسال كود التحقق إلى إيميلك! جارٍ تحويلك...</div>

            <button type="submit" class="btn-submit" id="submitBtn">إنشاء الحساب</button>
        </form>

        <div class="footer-link" id="FooterLink">
            لديك حساب بالفعل؟ <a href="login.html">سجّل دخولك</a>
        </div>
    </div>
</div>

<script>
const i18n = {
  ar: {
    backBtn: "رجوع",
    TtlSignup: "🧠 إنشاء حساب جديد",
    SubTtl: "انضم إلى Brain Battle وابدأ التحدي",
    usernameText: "الاسم المستعار",
    EmailText: "البريد الإلكتروني",
    PasswordText: "كلمة المرور",
    ConfirmPasswordText: "تأكيد كلمة المرور",
    placeholderUsername: "مثلاً vliex",
    placeholderEmail: "example@email.com",
    placeholderPassword: "••••••••",
    placeholderConfirmPassword: "••••••••",
    successMsg: "تم إرسال كود التحقق إلى إيميلك! جارٍ تحويلك...",
    submitBtn: "إنشاء الحساب",
    FooterLink: "لديك حساب بالفعل؟ <a href='login.html'>سجّل دخولك</a>",
    fillAllFields: "يرجى تعبئة جميع الحقول",
    passwordLength: "كلمة المرور يجب أن تكون 6 أحرف على الأقل",
    passwordMismatch: "كلمتا المرور غير متطابقتين",
    emailExists: "هذا الإيميل مسجل بحساب موجود بالفعل",
    sendError: "تعذّر إرسال كود التحقق. تأكد من إعداد EmailJS ثم حاول مرة أخرى",
    usernameExists: "اسم المستخدم موجود بالفعل، جرّب اسمًا آخر"
  },
  en: {
    backBtn: "Back",
    TtlSignup: "🧠 Create a New Account",
    SubTtl: "Join Brain Battle and start the challenge",
    usernameText: "Username",
    EmailText: "Email",
    PasswordText: "Password",
    ConfirmPasswordText: "Confirm Password",
    placeholderUsername: "e.g., vliex",
    placeholderEmail: "example@email.com",
    placeholderPassword: "••••••••",
    placeholderConfirmPassword: "••••••••",
    successMsg: "Verification code sent to your email! Redirecting...",
    submitBtn: "Create Account",
    FooterLink: "Already have an account? <a href='login.html'>Log in</a>",
    fillAllFields: "Please fill in all fields",
    passwordLength: "Password must be at least 6 characters",
    passwordMismatch: "Passwords do not match",
    emailExists: "This email is already registered",
    sendError: "Failed to send verification code. Make sure EmailJS is set up and try again",
    usernameExists: "Username already exists, try another one"
  }
};

function applyTranslations(l) {
  document.documentElement.lang = l;
  document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
  const t = i18n[l];
  document.getElementById('BackBtn').textContent = t.backBtn;
  document.getElementById('TtlSignup').textContent = t.TtlSignup;
  document.getElementById('SubTtl').textContent = t.SubTtl;
  document.getElementById('usernameText').textContent = t.usernameText;
  document.getElementById('EmailText').textContent = t.EmailText;
  document.getElementById('PasswordText').textContent = t.PasswordText;
  document.getElementById('ConfirmPasswordText').textContent = t.ConfirmPasswordText;
  document.getElementById('fullname').placeholder = t.placeholderUsername;
  document.getElementById('email').placeholder = t.placeholderEmail;
  document.getElementById('password').placeholder = t.placeholderPassword;
  document.getElementById('confirmPassword').placeholder = t.placeholderConfirmPassword;
  document.getElementById('successMsg').textContent = t.successMsg;
  document.getElementById('submitBtn').textContent = t.submitBtn;
  document.getElementById('FooterLink').innerHTML = t.FooterLink;
  document.getElementById('errorMsg').textContent = t.fillAllFields;
  document.getElementById('errorMsg').textContent = t.passwordLength;
  document.getElementById('errorMsg').textContent = t.passwordMismatch;
  document.getElementById('errorMsg').textContent = t.emailExists;
  document.getElementById('errorMsg').textContent = t.sendError;
}

const EMAILJS_PUBLIC_KEY  = "l4A_cZFEUEwyCzUn1";
const EMAILJS_SERVICE_ID  = "service_kvvq0zo";
const EMAILJS_TEMPLATE_ID = "template_d4m9id9";

if (window.emailjs) emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

function generateCode() {
    return String(Math.floor(100000 + Math.random() * 900000)); // كود من 6 أرقام
}

async function handleSignup(e) {
    e.preventDefault();
    const fullname = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const submitBtn = document.getElementById('submitBtn');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!fullname || !email || !password || !confirmPassword) {
        errorMsg.textContent = i18n[localStorage.getItem('lang') || 'ar'].fillAllFields;
        errorMsg.style.display = 'block';
        return false;
    }

    if (password.length < 6) {
        errorMsg.textContent = i18n[localStorage.getItem('lang') || 'ar'].passwordLength;
        errorMsg.style.display = 'block';
        return false;
    }

    if (password !== confirmPassword) {
    errorMsg.textContent = i18n[localStorage.getItem('lang') || 'ar'].passwordMismatch;
    errorMsg.style.display = 'block';
    return false;
}

const lang = localStorage.getItem('lang') || 'ar';

const { data: existingProfile, error: usernameCheckError } = await supabaseClient
    .from('profiles')
    .select('id')
    .ilike('fullname', fullname)
    .maybeSingle();

    if (usernameCheckError) {
        errorMsg.textContent = usernameCheckError.message;
        errorMsg.style.display = 'block';
        return false;
    }

    if (existingProfile) {
        errorMsg.textContent = i18n[lang].usernameExists;
        errorMsg.style.display = 'block';
        return false;
    }

    const { error: signUpError } = await supabaseClient.auth.signUp({
        email,
        password,
        options: { data: { fullname } }
    });

    if (signUpError) {
    const duplicateUsername =
        signUpError.message.includes('profiles_fullname_unique_idx') ||
        signUpError.message.includes('duplicate key');

    errorMsg.textContent = duplicateUsername
        ? i18n[lang].usernameExists
        : signUpError.message.includes('already registered')
            ? i18n[lang].emailExists
            : signUpError.message;

    errorMsg.style.display = 'block';
    return false;
    }

    const code = generateCode();
    const pendingUser = {
        fullname, email, password, code,
        createdAt: Date.now(),
        expiresAt: Date.now() + 5 * 60 * 1000 
    };

    submitBtn.disabled = true;
    submitBtn.innerHTML = 'جارٍ إرسال الكود<span class="spinner"></span>';

    try {
        if (!window.emailjs || EMAILJS_PUBLIC_KEY === "YOUR_PUBLIC_KEY") {
            throw new Error('EmailJS غير مُعد بعد');
        }
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
            to_name: fullname,
            to_email: email,
            code: code
        });

        sessionStorage.setItem('bb_pending_user', JSON.stringify(pendingUser));
        successMsg.textContent = i18n[localStorage.getItem('lang') || 'ar'].successMsg;
        successMsg.style.display = 'block';
        setTimeout(() => { window.location.href = 'verify.html'; }, 900);
    } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = i18n[localStorage.getItem('lang') || 'ar'].submitBtn;
        errorMsg.textContent = i18n[localStorage.getItem('lang') || 'ar'].sendError;
        errorMsg.style.display = 'block';
        console.error(err);
    }

    return false;
}
applyTranslations(localStorage.getItem('lang') || 'ar');
</script>

</body>
</html>
