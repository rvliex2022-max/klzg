<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;background:#080b14;color:#f7f8ff;min-height:100vh}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,#35206a55,transparent 35%),radial-gradient(circle at 80% 90%,#005c7a55,transparent 35%);pointer-events:none}
.wrap{max-width:1050px;margin:0 auto;padding:70px 18px 28px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.logo{font-weight:900;font-size:22px;letter-spacing:.5px}
.badge{font-size:12px;background:#151a2b;border:1px solid #292f49;padding:8px 12px;border-radius:999px;color:#aeb8d8}

button{border:0;border-radius:13px;padding:14px 18px;font-weight:800;font-size:15px;cursor:pointer;background:#7c5cff;color:white;transition:.15s}
button:hover{transform:translateY(-1px);filter:brightness(1.08)}
button.secondary{background:#1b2235;color:#dbe2ff}
button.small{padding:8px 12px;font-size:13px;border-radius:10px}
input{width:100%;background:#0a0e19;border:1px solid #303750;color:white;border-radius:13px;padding:12px 14px;font-size:14px;outline:none}
input:focus{border-color:#7c5cff}
.mini{font-size:12px;color:#7f8aa7}

.msg-card{
  background:#111625cc;border:1px solid #252d46;border-radius:24px;
  box-shadow:0 18px 60px #0008;backdrop-filter:blur(12px);
  display:flex; height:min(72vh,640px); overflow:hidden;
}

.sidebar{ width:300px; min-width:220px; border-inline-start:1px solid #252d46; display:flex; flex-direction:column; }
.sidebar-search{ padding:16px 16px 8px; }
.sidebar-section-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px 6px; }
.sidebar-section-label{ font-size:11px; color:#7f8aa7; letter-spacing:.3px; }
.req-count{ background:#d94b67; color:#fff; font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:10px; }

.conv-list{ overflow-y:auto; flex:1; padding:0 8px 8px; }
.conv-item{
  display:flex; align-items:flex-start; gap:12px; padding:12px; border-radius:16px; cursor:pointer;
  border:1px solid transparent; margin-bottom:6px; transition: background .15s ease, border-color .15s ease;
}
.conv-item:hover{ background:#171e31; }
.conv-item.active{ background:#171e31cc; border-color:#7c5cff55; }

.conv-avatar{
  width:38px; height:38px; border-radius:50%; background:#0c1120; border:1px solid #28304a;
  display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; position:relative;
}
.status-dot{ position:absolute; bottom:-1px; inset-inline-end:-1px; width:11px; height:11px; border-radius:50%; background:#5a6280; border:2px solid #171e31; }
.status-dot.online{ background:#2bd28b; }
.chat-header-sub.online-text{ color:#2bd28b; }

.conv-meta{ flex:1; min-width:0; }
.conv-top-row{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.conv-name{ font-size:14.5px; font-weight:700; color:#f7f8ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.conv-preview{ font-size:12.5px; color:#8490af; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px; }

.request-item{ padding:12px; border-radius:16px; background:#171e31; border:1px solid #303953; margin:0 8px 8px; }
.request-item .req-name{ font-weight:700; font-size:14px; margin-bottom:8px; }
.request-actions{ display:flex; gap:8px; }

.chat{ flex:1; display:flex; flex-direction:column; min-width:0; }
.chat-header{ display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid #252d46; }
.chat-header .conv-avatar{ width:34px; height:34px; font-size:15px; }
.chat-header-name{ font-size:15.5px; font-weight:800; }
.chat-header-sub{ font-size:11.5px; color:#7f8aa7; }

.chat-body{ flex:1; overflow-y:auto; padding:20px 22px; display:flex; flex-direction:column; gap:4px; }
.date-divider{ align-self:center; background:#151a2b; border:1px solid #292f49; color:#aeb8d8; font-size:11.5px; padding:4px 14px; border-radius:999px; margin:12px 0; }

.msg-row{ display:flex; margin-bottom:4px; flex-direction:column; }
.msg-row.out{ align-items:flex-end; }
.msg-row.in{ align-items:flex-start; }
.msg-sender{ font-size:11px; color:#7f8aa7; margin:0 4px 3px; }

.bubble{ max-width:62%; background:#171e31; border:1px solid #303953; padding:10px 14px 8px; border-radius:14px; border-start-start-radius:4px; line-height:1.55; font-size:14.5px; }
.msg-row.out .bubble{ background:#2a2350; border-color:#4635a3; border-start-start-radius:14px; border-start-end-radius:4px; }
.bubble .msg-time{ display:block; text-align:end; font-size:10.5px; color:#7f8aa7; margin-top:4px; }

.chat-input-bar{ display:flex; align-items:center; gap:10px; padding:14px 18px; border-top:1px solid #252d46; }
.chat-input-bar input{ flex:1; border-radius:999px; }
.send-btn{ background:#7c5cff; color:#fff; border:0; width:42px; height:42px; border-radius:50%; font-size:16px; padding:0; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.send-btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

.empty-state{ margin:auto; text-align:center; color:#7f8aa7; font-size:13.5px; padding:20px; }

.conv-list::-webkit-scrollbar, .chat-body::-webkit-scrollbar{ width:8px; }
.conv-list::-webkit-scrollbar-thumb, .chat-body::-webkit-scrollbar-thumb{ background:#252d46; border-radius:4px; }

.bottom-bar{ position:fixed; bottom:20px; left:20px; z-index:9999; display:flex; gap:10px; }
#langToggleBtn, #backBtn{ box-shadow:0 4px 14px rgba(0,0,0,0.5); margin:0; }
#backBtn{ display:flex; align-items:center; gap:6px; }

@media (max-width:760px){
  .msg-card{ height:78vh; }
  .sidebar{ position:absolute; inset:0; z-index:2; background:#0d1120; border-radius:24px; transition: transform .2s ease; }
  .sidebar.hide{ transform: translateX(100%); }
  .mobile-back{ display:inline-flex !important; }
  .wrap{ padding:60px 12px 20px; }
}
.mobile-back{ display:none; background:none; border:0; color:#7c5cff; font-size:18px; padding:4px; }

.modal-overlay{ position:fixed; inset:0; background:#080b14ee; z-index:99999; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal-card{ background:#111625; border:1px solid #252d46; border-radius:20px; padding:28px; width:100%; max-width:400px; box-shadow:0 18px 60px #0008; }
.modal-card h2{ margin:0 0 8px; font-size:20px; }
.modal-card p{ color:#aeb7cf; font-size:13.5px; margin:0 0 18px; }
.modal-card input{ margin-bottom:14px; }
.modal-close{ background:none; color:#7f8aa7; padding:6px; width:auto; }

.gate-card{ text-align:center; }
.gate-card .icon{ font-size:40px; margin-bottom:10px; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">

  <div class="top">
    <div class="logo">💬 <span id="pageTitle">الرسائل</span></div>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="badge" id="badgeText">محادثات حقيقية بين مستخدمي الموقع</div>
      <button class="small secondary" id="openAddFriendBtn">➕ إضافة صديق</button>
    </div>
  </div>

  <div class="msg-card">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-search">
        <input type="text" id="searchBox" placeholder="ابحث عن أصدقائك..." oninput="renderList(this.value)">
      </div>

      <div class="sidebar-section-row">
        <span class="sidebar-section-label">طلبات الصداقة</span>
        <span class="req-count" id="reqCount" style="display:none">0</span>
      </div>
      <div id="requestsList"></div>

      <div class="sidebar-section-label" style="padding-top:10px">القنوات وجهات الاتصال</div>
      <div class="conv-list" id="convList"></div>
    </div>

    <div class="chat">
      <div class="chat-header">
        <button class="mobile-back" id="mobileBackBtn">←</button>
        <div class="conv-avatar"><span id="headerAvatar">💬</span><span class="status-dot" id="headerStatusDot" style="display:none"></span></div>
        <div>
          <div class="chat-header-name" id="headerName">اختر محادثة</div>
          <div class="chat-header-sub" id="headerSub"></div>
        </div>
      </div>

      <div class="chat-body" id="chatBody"></div>

      <div class="chat-input-bar">
        <input type="text" id="msgInput" placeholder="اكتب رسالة..." disabled>
        <button class="send-btn" id="sendBtn" disabled>➤</button>
      </div>
    </div>
  </div>
</div>

<div class="bottom-bar">
  <button id="backBtn" class="secondary" onclick="location.href='index.html'">🧠 <span id="backBtnText">رجوع للعبة</span></button>
  <button id="langToggleBtn" onclick="toggleLanguage()">English</button>
</div>

<div class="modal-overlay" id="gateModal" style="display:none">
  <div class="modal-card gate-card">
    <div class="icon">🔒</div>
    <h2>سجّل دخولك للمتابعة</h2>
    <p>الشات متاح فقط لأعضاء Brain Battle المسجّلين. سجّل دخولك أو أنشئ حساب جديد عشان تقدر تراسل أصدقاءك.</p>
    <button onclick="location.href='login.html'" style="width:100%;margin-bottom:10px">تسجيل الدخول</button>
    <button class="secondary" onclick="location.href='signup.html'" style="width:100%">إنشاء حساب جديد</button>
  </div>
</div>

<div class="modal-overlay" id="addFriendModal" style="display:none">
  <div class="modal-card">
    <h2>إضافة صديق</h2>
    <p>اكتب اسم صديقك بالضبط زي ما هو مسجل بحسابه.</p>
    <input type="text" id="friendNameInput" maxlength="18" placeholder="اسم المستخدم">
    <button id="sendRequestBtn" style="width:100%">إرسال طلب صداقة</button>
    <div id="addFriendMsg" class="mini" style="margin-top:10px"></div>
    <button class="modal-close" id="closeAddFriendBtn" style="width:100%;margin-top:6px">إغلاق</button>
  </div>
</div>

<script>
const GENERAL_CHAT_ID = "general";
const GENERAL_CHAT_NAME = "Brain Battle";
const ONLINE_THRESHOLD_MS = 25000;
const HEARTBEAT_MS = 15000;

let uid = null, myName = "";
let activeChatId = null, activeOtherUid = null;
let friendships = [];      
let pendingRequests = [];  
let friendStatus = {};     
let messagesChannel = null;
let requestsChannel = null;
let friendshipsChannel = null;
let profilesChannel = null;

const $ = (id) => document.getElementById(id);

async function boot(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session){
    $("gateModal").style.display = "flex";
    return;
  }
  uid = session.user.id;

  const { data: profile, error } = await supabaseClient
    .from("profiles").select("fullname").eq("id", uid).maybeSingle();
  if (error || !profile){
    $("gateModal").style.display = "flex";
    return;
  }
  myName = profile.fullname;

  $("msgInput").disabled = false;
  $("sendBtn").disabled = false;

  await loadFriendships();
  await loadPendingRequests();
  subscribeRealtime();
  openChat(GENERAL_CHAT_ID, GENERAL_CHAT_NAME, "👥", "قناة عامة");

  heartbeat();
  setInterval(heartbeat, HEARTBEAT_MS);
  setInterval(() => {
    renderList($("searchBox").value);
    if (activeOtherUid) updateHeaderStatus(activeOtherUid);
  }, 8000);
}

async function heartbeat(){
  await supabaseClient.from("profiles").update({ last_seen: new Date().toISOString() }).eq("id", uid);
}

function isOnline(lastSeenIso){
  if (!lastSeenIso) return false;
  return (Date.now() - new Date(lastSeenIso).getTime()) < ONLINE_THRESHOLD_MS;
}

function pairId(a,b){ return [a,b].sort().join("_"); }

async function loadFriendships(){
  const { data, error } = await supabaseClient
    .from("friendships")
    .select("user_a,user_b,name_a,name_b")
    .or(`user_a.eq.${uid},user_b.eq.${uid}`);
  if (error){ console.error(error); return; }
  friendships = (data||[]).map(row => {
    const otherUid = row.user_a === uid ? row.user_b : row.user_a;
    const otherName = row.user_a === uid ? row.name_b : row.name_a;
    return { otherUid, otherName };
  });
  await refreshFriendStatuses();
  renderList($("searchBox").value);
}

async function refreshFriendStatuses(){
  const ids = friendships.map(f => f.otherUid);
  if (ids.length === 0) return;
  const { data } = await supabaseClient.from("profiles").select("id,last_seen").in("id", ids);
  (data||[]).forEach(p => friendStatus[p.id] = p.last_seen);
}

async function loadPendingRequests(){
  const { data, error } = await supabaseClient
    .from("friend_requests")
    .select("id,from_id,from_name")
    .eq("to_id", uid).eq("status","pending");
  if (error){ console.error(error); return; }
  pendingRequests = data || [];
  renderRequests();
}

function subscribeRealtime(){
  requestsChannel = supabaseClient
    .channel("friend_requests_incoming")
    .on("postgres_changes", { event: "*", schema: "public", table: "friend_requests", filter: `to_id=eq.${uid}` },
      () => loadPendingRequests())
    .subscribe();

  friendshipsChannel = supabaseClient
    .channel("friendships_updates")
    .on("postgres_changes", { event: "*", schema: "public", table: "friendships" },
      (payload) => {
        const row = payload.new?.id ? payload.new : payload.old;
        if (row && (row.user_a === uid || row.user_b === uid)) loadFriendships();
      })
    .subscribe();

  profilesChannel = supabaseClient
    .channel("profiles_presence")
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "profiles" },
      (payload) => {
        const row = payload.new;
        if (!row) return;
        friendStatus[row.id] = row.last_seen;
        renderList($("searchBox").value);
        if (activeOtherUid === row.id) updateHeaderStatus(row.id);
      })
    .subscribe();
}

function renderRequests(){
  const box = $("requestsList");
  const count = $("reqCount");
  box.innerHTML = "";
  if (pendingRequests.length === 0){ count.style.display = "none"; return; }
  count.style.display = "inline-block";
  count.textContent = pendingRequests.length;
  pendingRequests.forEach(r => {
    const item = document.createElement("div");
    item.className = "request-item";
    item.innerHTML = `
      <div class="req-name">${r.from_name}</div>
      <div class="request-actions">
        <button class="small" data-accept="${r.id}" data-from="${r.from_id}" data-fromname="${r.from_name}">قبول</button>
        <button class="small secondary" data-decline="${r.id}">رفض</button>
      </div>`;
    box.appendChild(item);
  });
  box.querySelectorAll("[data-accept]").forEach(btn => {
    btn.addEventListener("click", () => acceptRequest(btn.dataset.accept, btn.dataset.from, btn.dataset.fromname));
  });
  box.querySelectorAll("[data-decline]").forEach(btn => {
    btn.addEventListener("click", () => declineRequest(btn.dataset.decline));
  });
}

async function acceptRequest(requestId, fromUid, fromName){
  try{
    const a = uid < fromUid ? uid : fromUid;
    const b = uid < fromUid ? fromUid : uid;
    const nameA = a === uid ? myName : fromName;
    const nameB = b === uid ? myName : fromName;
    const { error: insErr } = await supabaseClient.from("friendships")
      .insert({ user_a: a, user_b: b, name_a: nameA, name_b: nameB });
    if (insErr) throw insErr;
    await supabaseClient.from("friend_requests").delete().eq("id", requestId);
    await loadFriendships();
    await loadPendingRequests();
  }catch(err){ alert("تعذر قبول الطلب: " + err.message); }
}
async function declineRequest(requestId){
  try{ await supabaseClient.from("friend_requests").delete().eq("id", requestId); await loadPendingRequests(); }
  catch(err){ alert("تعذر رفض الطلب: " + err.message); }
}

function renderList(filter=""){
  const list = $("convList");
  list.innerHTML = "";

  const generalItem = document.createElement("div");
  generalItem.className = "conv-item" + (activeChatId === GENERAL_CHAT_ID ? " active" : "");
  generalItem.innerHTML = `
    <div class="conv-avatar">👥</div>
    <div class="conv-meta">
      <div class="conv-top-row"><span class="conv-name">${GENERAL_CHAT_NAME}</span></div>
      <div class="conv-preview">قناة عامة لكل الأعضاء</div>
    </div>`;
  generalItem.addEventListener("click", () => openChat(GENERAL_CHAT_ID, GENERAL_CHAT_NAME, "👥", "قناة عامة"));
  list.appendChild(generalItem);

  const filtered = friendships.filter(f => (f.otherName||"").includes(filter));
  if (friendships.length === 0){
    const empty = document.createElement("div");
    empty.className = "mini";
    empty.style.padding = "10px 12px";
    empty.textContent = "ما عندك أصدقاء بعد. اضغط \"إضافة صديق\" فوق.";
    list.appendChild(empty);
  }

  filtered.forEach(f => {
    const chatId = pairId(uid, f.otherUid);
    const online = isOnline(friendStatus[f.otherUid]);
    const item = document.createElement("div");
    item.className = "conv-item" + (activeChatId === chatId ? " active" : "");
    item.innerHTML = `
      <div class="conv-avatar">🧑<span class="status-dot${online?" online":""}"></span></div>
      <div class="conv-meta">
        <div class="conv-top-row"><span class="conv-name">${f.otherName}</span></div>
        <div class="conv-preview">${online ? "متصل الآن" : "غير متصل"}</div>
      </div>`;
    item.addEventListener("click", () => openChat(chatId, f.otherName, "🧑", "محادثة خاصة", f.otherUid));
    list.appendChild(item);
  });
}

function dateLabel(iso){ if(!iso) return ""; return new Date(iso).toLocaleDateString("ar-EG"); }
function timeLabel(iso){ if(!iso) return ""; return new Date(iso).toTimeString().slice(0,5); }

function updateHeaderStatus(otherUid){
  const online = isOnline(friendStatus[otherUid]);
  const dot = $("headerStatusDot");
  if (dot) dot.classList.toggle("online", online);
  const sub = $("headerSub");
  if (sub && sub.dataset.baseLabel){
    sub.textContent = sub.dataset.baseLabel + (online ? " · متصل الآن" : " · غير متصل");
    sub.classList.toggle("online-text", online);
  }
}

function openChat(chatId, name, avatar, sub, otherUid=null){
  activeChatId = chatId;
  activeOtherUid = otherUid;
  $("headerAvatar").textContent = avatar;
  $("headerName").textContent = name;
  const subEl = $("headerSub");
  subEl.dataset.baseLabel = sub;
  subEl.textContent = sub;
  subEl.classList.remove("online-text");
  const dot = $("headerStatusDot");
  dot.style.display = otherUid ? "block" : "none";
  dot.classList.remove("online");
  if (otherUid) updateHeaderStatus(otherUid);
  renderList($("searchBox").value);
  listenToMessages(chatId);
  if (window.innerWidth <= 760) $("sidebar").classList.add("hide");
}

async function listenToMessages(chatId){
  if (messagesChannel) supabaseClient.removeChannel(messagesChannel);
  const body = $("chatBody");
  body.innerHTML = `<div class="empty-state">جارٍ تحميل الرسائل...</div>`;

  const { data, error } = await supabaseClient
    .from("messages").select("sender_id,sender_name,text,created_at")
    .eq("chat_id", chatId).order("created_at", { ascending: true }).limit(200);

  if (error){ body.innerHTML = `<div class="empty-state">تعذر تحميل الرسائل: ${error.message}</div>`; return; }

  renderMessages(data || []);

  messagesChannel = supabaseClient
    .channel("messages_" + chatId)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: `chat_id=eq.${chatId}` },
      (payload) => { if (activeChatId === chatId) appendMessage(payload.new); })
    .subscribe();
}

function renderMessages(msgs){
  const body = $("chatBody");
  body.innerHTML = "";
  if (msgs.length === 0){ body.innerHTML = `<div class="empty-state">ما فيه رسائل بعد، ابدأ الحديث 👋</div>`; return; }
  let lastDate = null;
  msgs.forEach(m => {
    const dl = dateLabel(m.created_at);
    if (dl && dl !== lastDate){
      const chip = document.createElement("div");
      chip.className = "date-divider"; chip.textContent = dl;
      body.appendChild(chip); lastDate = dl;
    }
    appendMessage(m, false);
  });
  body.scrollTop = body.scrollHeight;
}

function appendMessage(m, scroll=true){
  const body = $("chatBody");
  if (body.querySelector(".empty-state")) body.innerHTML = "";
  const isMine = m.sender_id === uid;
  const row = document.createElement("div");
  row.className = "msg-row " + (isMine ? "out" : "in");
  row.innerHTML = `
    ${!isMine ? `<div class="msg-sender">${m.sender_name||"مستخدم"}</div>` : ""}
    <div class="bubble"><span class="msg-text"></span><span class="msg-time">${timeLabel(m.created_at)}</span></div>`;
  row.querySelector(".msg-text").textContent = m.text || "";
  body.appendChild(row);
  if (scroll) body.scrollTop = body.scrollHeight;
}

async function sendMessage(){
  const input = $("msgInput");
  const text = input.value.trim();
  if (!text || !activeChatId || !uid) return;
  input.value = "";
  const { error } = await supabaseClient.from("messages").insert({
    chat_id: activeChatId, sender_id: uid, sender_name: myName, text
  });
  if (error) alert("تعذر إرسال الرسالة: " + error.message);
}

$("sendBtn").addEventListener("click", sendMessage);
$("msgInput").addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
$("searchBox").addEventListener("input", e => renderList(e.target.value));
$("mobileBackBtn").addEventListener("click", () => $("sidebar").classList.remove("hide"));

$("openAddFriendBtn").addEventListener("click", () => {
  $("addFriendMsg").textContent = "";
  $("friendNameInput").value = "";
  $("addFriendModal").style.display = "flex";
});
$("closeAddFriendBtn").addEventListener("click", () => $("addFriendModal").style.display = "none");

$("sendRequestBtn").addEventListener("click", async () => {
  const name = $("friendNameInput").value.trim();
  const msgEl = $("addFriendMsg");
  if (!name){ msgEl.textContent = "اكتب اسم صديقك أول."; return; }
  if (name.toLowerCase() === myName.toLowerCase()){ msgEl.textContent = "هذا اسمك أنت 🙂"; return; }
  msgEl.textContent = "جارٍ البحث...";
  try{
    const { data: target, error } = await supabaseClient
      .from("profiles").select("id,fullname").ilike("fullname", name).maybeSingle();
    if (error) throw error;
    if (!target){ msgEl.textContent = "ما فيه مستخدم بهذا الاسم."; return; }
    if (friendships.some(f => f.otherUid === target.id)){ msgEl.textContent = "هذا الشخص صديقك أصلاً."; return; }

    const { error: reqErr } = await supabaseClient.from("friend_requests").insert({
      from_id: uid, from_name: myName, to_id: target.id, to_name: target.fullname, status: "pending"
    });
    if (reqErr) throw reqErr;
    msgEl.textContent = "تم إرسال طلب الصداقة ✅";
    $("friendNameInput").value = "";
  }catch(err){ msgEl.textContent = "خطأ: " + err.message; }
});

const i18n = {
  ar: { pageTitle:"الرسائل", badge:"محادثات حقيقية بين مستخدمي الموقع", backBtn:"رجوع للعبة" },
  en: { pageTitle:"Messages", badge:"Real chat between site users", backBtn:"Back to game" }
};
let currentLang = localStorage.getItem('lang') || 'ar';
function setLanguage(l){
  currentLang = l;
  localStorage.setItem('lang', l);
  document.documentElement.lang = (l === 'ar') ? 'ar' : 'en';
  document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
  $('langToggleBtn').textContent = (l === 'ar') ? 'English' : 'العربية';
  const t = i18n[l];
  $('pageTitle').textContent = t.pageTitle;
  $('badgeText').textContent = t.badge;
  $('backBtnText').textContent = t.backBtn;
}
function toggleLanguage(){ setLanguage(currentLang === 'ar' ? 'en' : 'ar'); }
setLanguage(currentLang);

boot();
</script>
</body>
</html>
