<style>
:root{
  --bg:#080b14;
  --panel:#ffffff0f;
  --panel-strong:#12172bcc;
  --border:#242b47;
  --accent:#7c5cff;
  --accent-soft:#7c5cff26;
  --teal:#2fd4c8;
  --text:#f5f6ff;
  --muted:#8b93b5;
  --success:#3fe0a5;
  --danger:#ff6686;
  --radius-lg:28px;
  --radius-md:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Cairo',Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  line-height:1.5;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(circle at 15% 8%,#35206a4d,transparent 38%),
    radial-gradient(circle at 85% 92%,#005c7a4d,transparent 38%);
}

header{
  position:sticky;top:0;z-index:50;
  display:flex;justify-content:space-between;align-items:center;
  padding:22px clamp(20px,5vw,80px);
  border-bottom:1px solid var(--border);
  background:#080b14cc;backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:800;font-size:clamp(18px,2.2vw,22px)}
.brand-mark{display:block;width:44px;height:44px}
nav{display:flex;gap:clamp(20px,4vw,44px)}
nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;position:relative;transition:.2s}
nav a::after{content:"";position:absolute;right:0;left:0;bottom:-6px;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .2s}
nav a:hover{color:var(--text)}
nav a:hover::after{transform:scaleX(1)}

main{max-width:1100px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(20px,5vw,40px) 100px}

.profile-card{
  display:grid;
  grid-template-columns:clamp(180px,24vw,280px) 1fr;
  gap:clamp(28px,5vw,64px);
  align-items:start;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:clamp(24px,4vw,44px);
  box-shadow:0 24px 70px #0009;
  backdrop-filter:blur(14px);
}

.profile-image{
  aspect-ratio:1/1;width:100%;border-radius:var(--radius-md);
  overflow:hidden;background:#161c33;position:relative;cursor:pointer;
  border:1px solid var(--border);
}
.profile-image img{width:100%;height:100%;object-fit:cover;display:block}
.profile-image .img-overlay{
  position:absolute;inset:0;display:flex;justify-content:center;align-items:center;
  background:linear-gradient(180deg,#00000000,#000000c9);
  color:#fff;font-size:14px;font-weight:700;opacity:0;transition:.2s;
  text-align:center;padding:16px;
}
.profile-image:hover .img-overlay{opacity:1}
.profile-image.readonly{cursor:default}
.profile-image.readonly .img-overlay{display:none}

.profile-info{min-width:0}
.username{font-size:clamp(24px,3.4vw,34px);font-weight:800;margin-bottom:26px;word-break:break-word}
.about-title{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:12px}
.about-box,.about-textarea{
  width:100%;min-height:150px;border-radius:var(--radius-md);
  padding:20px 22px;font-size:16px;line-height:1.7;color:var(--text);
  font-family:'Cairo',Arial,sans-serif;
}
.about-box{
  background:#ffffff0a;border:1px solid var(--border);cursor:text;transition:.15s;
  white-space:pre-wrap;
}
.about-box:hover{border-color:#39406b}
.about-textarea{
  background:#ffffff12;border:2px solid var(--accent);resize:vertical;outline:none;
}

.save-row{display:flex;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap}
button#saveBtn{
  background:var(--accent);color:#fff;border:0;border-radius:14px;
  padding:14px 32px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:'Cairo',Arial,sans-serif;
  box-shadow:0 12px 28px var(--accent-soft);transition:.15s;
}
button#saveBtn:hover{background:#6a4be0;transform:translateY(-1px)}
button#saveBtn:active{transform:translateY(0)}
#saveStatus{
  font-size:14px;font-weight:700;color:var(--success);
  opacity:0;transition:opacity .3s;
}
#saveStatus.show{opacity:1}

.stats-section{
  display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:36px;
}
.stat{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:28px;text-align:center;backdrop-filter:blur(14px);
}
.stat-icon{font-size:26px;margin-bottom:10px}
.stat h2{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:18px}
.stat-box{font-size:20px;font-weight:800;color:var(--text)}

.history{
  margin-top:36px;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:clamp(20px,3vw,32px);
  backdrop-filter:blur(14px);box-shadow:0 24px 70px #0006;
}
.history-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.history-head .stat-icon{margin:0;font-size:24px}
.history-head h2{font-size:18px;font-weight:800;color:var(--text)}
.history-list{display:flex;flex-direction:column;gap:12px;max-height:440px;overflow-y:auto;padding:2px}
.history-list::-webkit-scrollbar{width:8px}
.history-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.history-empty{text-align:center;color:var(--muted);font-weight:700;padding:28px 12px}
.history-item{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
  background:#ffffff0a;border:1px solid var(--border);border-radius:var(--radius-md);
  padding:14px 18px;border-inline-start-width:4px;
}
.history-item.win{border-inline-start-color:var(--success)}
.history-item.loss{border-inline-start-color:var(--danger)}
.history-item.tie{border-inline-start-color:var(--muted)}
.history-badge{
  min-width:74px;text-align:center;font-size:13px;font-weight:800;
  padding:6px 14px;border-radius:999px;
}
.history-item.win .history-badge{background:#3fe0a526;color:var(--success)}
.history-item.loss .history-badge{background:#ff668626;color:var(--danger)}
.history-item.tie .history-badge{background:#8b93b526;color:var(--muted)}
.history-meta{min-width:0}
.history-opp{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-date{font-size:12px;color:var(--muted);margin-top:2px}
.history-score{font-size:20px;font-weight:800;direction:ltr;unicode-bidi:isolate;letter-spacing:1px;white-space:nowrap}
@media(max-width:720px){
  .history-item{grid-template-columns:1fr auto;gap:10px 12px}
  .history-badge{grid-column:1 / -1;justify-self:start}
}

@media(max-width:720px){
  header{padding:18px 20px}
  nav{gap:18px}
  nav a{font-size:13px}
  .profile-card{grid-template-columns:1fr;text-align:center}
  .profile-image{width:min(220px,60vw);margin:0 auto}
  .about-title{margin-top:4px}
  .save-row{justify-content:center}
  .stats-section{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <a href="index.html" id="navBrand" class="brand"><img class="brand-mark" src="logo.svg" alt=""><span>Brain Battle</span></a>
  <nav>
    <a href="https://linktr.ee/vliex" id="navContact">Contact Us</a>
    <a href="https://www.paypal.com/paypalme/LayanM808" id="navSupport">Support us</a>
  </nav>
</header>

<main>
  <section class="profile-card">
    <div class="profile-image" id="profileImageWrap" title="Press To Change Image">
      <img id="profileImg" src="profile.jpg" alt="Profile Picture">
      <div class="img-overlay" id="imgOverlayText">🖼️ Change Image</div>
    </div>
    <input type="file" id="imageInput" accept="image/*" style="display:none">

    <div class="profile-info">
      <div class="username" id="profileUsername">Your Name</div>
      <div class="about-title" id="aboutTitle">About me:</div>
      <div class="about-box" id="aboutBox" title="Press To Talk">Tell Your Mommy About Everything</div>

      <div class="save-row">
        <button id="saveBtn">Save Profile</button>
        <span id="saveStatus">تم الحفظ ✓</span>
      </div>
    </div>
  </section>

  <section class="stats-section">
    <div class="stat">
      <div class="stat-icon">🎮</div>
      <h2 id="statGamesTitle">Your Game Honey</h2>
      <div class="stat-box" id="statGamesBox">No games yet</div>
    </div>
    <div class="stat">
      <div class="stat-icon">🧠</div>
      <h2 id="statLevelTitle">My little Good Boy Brain Level</h2>
      <div class="stat-box" id="statLevelBox">Brain Level: 0</div>
    </div>
  </section>

  <section class="history">
    <div class="history-head">
      <div class="stat-icon">📜</div>
      <h2 id="historyTitle">Match History</h2>
    </div>
    <div class="history-list" id="historyList"></div>
  </section>
</main>
<script>

const i18n = {
  ar: {
    navBrand: "Brain Battle", navContact: "تواصل معنا", navSupport: "ادعمنا",
    imgOverlayText: "🖼️ تغيير الصورة",
    aboutTitle: "نبذة عني:",
    statGamesTitle: "ألعابك", statGamesBox: "لا توجد ألعاب بعد",
    statLevelTitle: "مستوى ذكائك", statLevelBox: "المستوى: 0",
    saveBtn: "حفظ",
    saveFailed: "تعذّر الحفظ ⚠",
    uploadFailed: "تعذّر رفع الصورة ⚠",
    historyTitle: "سجل المباريات",
    historyEmpty: "ما فيه مباريات بعد",
    historyLoading: "جارٍ التحميل…",
    historyFailed: "تعذّر تحميل السجل ⚠",
    vs: "ضد",
    win: "فوز", loss: "خسارة", tie: "تعادل",
    unknownOpponent: "لاعب"
  },
  en: {
    navBrand: "Brain Battle", navContact: "Contact Us", navSupport: "Support us",
    imgOverlayText: "🖼️ Change Image",
    aboutTitle: "About me:",
    statGamesTitle: "Game Win", statGamesBox: "No games yet",
    statLevelTitle: "Brain Level", statLevelBox: "Brain Level: 0",
    saveBtn: "Save",
    saveFailed: "Failed to save ⚠",
    uploadFailed: "Failed to upload image ⚠",
    historyTitle: "Match History",
    historyEmpty: "No matches yet",
    historyLoading: "Loading…",
    historyFailed: "Failed to load history ⚠",
    vs: "vs",
    win: "Win", loss: "Loss", tie: "Tie",
    unknownOpponent: "Player"
  }
};

let currentLang = localStorage.getItem('lang') || 'ar';

function applyTranslations(l){
  document.documentElement.lang = l;
  document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
  const t = i18n[l];
  document.getElementById('navContact').textContent = t.navContact;
  document.getElementById('navSupport').textContent = t.navSupport;
  document.getElementById('imgOverlayText').textContent = t.imgOverlayText;
  document.getElementById('aboutTitle').textContent = t.aboutTitle;
  document.getElementById('statGamesTitle').textContent = t.statGamesTitle;
  document.getElementById('statGamesBox').textContent = currentGamesWon > 0
    ? (l === 'ar' ? `${currentGamesWon} فوز` : `${currentGamesWon} ${currentGamesWon === 1 ? 'win' : 'wins'}`)
    : t.statGamesBox;
  document.getElementById('statLevelTitle').textContent = t.statLevelTitle;
  document.getElementById('statLevelBox').textContent = l === 'ar'
    ? `المستوى: ${currentBrainScore}`
    : `Brain Level: ${currentBrainScore}`;
  document.getElementById('saveBtn').textContent = t.saveBtn;
  document.getElementById('historyTitle').textContent = t.historyTitle;
  renderHistory();
  const langBtn = document.getElementById('langToggleBtn');
  if(langBtn) langBtn.textContent = (l === 'ar') ? 'English' : 'العربية';

  if(aboutBox.textContent.trim() === defaultAbout.ar || aboutBox.textContent.trim() === defaultAbout.en){
    currentAboutText = defaultAbout[l];
    aboutBox.textContent = defaultAbout[l];
  }
}

const profileImg = document.getElementById("profileImg");
const profileImageWrap = document.getElementById("profileImageWrap");
const imageInput = document.getElementById("imageInput");
const aboutBox = document.getElementById("aboutBox");
const saveBtn = document.getElementById("saveBtn");
const saveStatus = document.getElementById("saveStatus");

const defaultAbout = {
  ar: "احكيلي عن نفسك",
  en: "Tell Your Mommy About Everything"
};

let currentAboutText = aboutBox.textContent;
let currentImageFile = null;
let currentUser = null;
let viewedUserId = null;
let isOwnProfile = true;
let currentGamesWon = 0;
let currentBrainScore = 0;
let historyRows = [];
let historyState = 'loading'; // 'loading' | 'ready' | 'error'
let historyError = '';

profileImageWrap.addEventListener("click", () => { if (isOwnProfile) imageInput.click(); });

imageInput.addEventListener("change", () => {
  const file = imageInput.files[0];
  if(!file) return;
  currentImageFile = file;
  const reader = new FileReader();
  reader.onload = (e) => {
    profileImg.src = e.target.result;
  };
  reader.readAsDataURL(file);
});

aboutBox.addEventListener("click", () => {
  if (!isOwnProfile) return;
  if(aboutBox.dataset.editing === "true") return;

  const textarea = document.createElement("textarea");
  textarea.className = "about-textarea";
  textarea.value = (currentAboutText === defaultAbout.ar || currentAboutText === defaultAbout.en) ? "" : currentAboutText;
  textarea.placeholder = "Talk Baby Talk...";

  aboutBox.replaceWith(textarea);
  textarea.focus();

  function finishEditing(){
    currentAboutText = textarea.value.trim() || defaultAbout[currentLang];
    aboutBox.textContent = currentAboutText;
    aboutBox.dataset.editing = "false";
    textarea.replaceWith(aboutBox);
  }

  textarea.addEventListener("blur", finishEditing);
  textarea.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      textarea.blur();
    }
  });
});

async function uploadAvatarIfNeeded(){
  if(!currentImageFile || !currentUser) return {};
  const ext = (currentImageFile.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${currentUser.id}/avatar.${ext}`;

  const { error: uploadError } = await supabaseClient
    .storage.from('avatars')
    .upload(path, currentImageFile, { upsert: true });

  if(uploadError) return { error: uploadError };

  const { data } = supabaseClient.storage.from('avatars').getPublicUrl(path);
  return { url: data.publicUrl + '?t=' + Date.now() };
}

saveBtn.addEventListener("click", async () => {
  if(!currentUser){
    flashStatus(i18n[currentLang].saveFailed);
    return;
  }

  const { url: newAvatarUrl, error: uploadError } = await uploadAvatarIfNeeded();
  if(uploadError){
    console.error("Upload error:", uploadError);
    flashStatus(i18n[currentLang].uploadFailed);
    return;
  }

  const updates = { about: currentAboutText };
  if(newAvatarUrl) updates.avatar_url = newAvatarUrl;

  const { error } = await supabaseClient
    .from('profiles')
    .update(updates)
    .eq('id', currentUser.id);

  if(error){
    console.error("Save error:", error);
    flashStatus(i18n[currentLang].saveFailed);
  }else{
    currentImageFile = null;
    flashStatus(randomSuccessMessage());
  }
});

const successMessages = [
  "You Are Such A Good Boy ✓",
  "Your Mommy Is Proud Of You ✓",
  "Can You Kiss Me Before You leave? 🥺",
  "Take Care Sweety 🥰",
  "I Tell You To Take Care Why You Still Do The Wrong Thing? 😡",
  "I Like Your A** Man 😏",
  "Go To Gym And Get Some Muscles B**ch💪",
  "I Will Come To Slap Your A** If You Will Not Give Me Kiss😡",
  "Spam Kisses For Me My little Good Boy 😘",
  "I Will Come To Suck Your Teddies Right Now 😏",
  "This Is My Instagram: @_vliex5 Send Me Something Spicey 😏",
];

function randomSuccessMessage(){
  return successMessages[Math.floor(Math.random() * successMessages.length)];
}

function flashStatus(msg){
  saveStatus.textContent = msg;
  saveStatus.classList.add("show");
  setTimeout(() => saveStatus.classList.remove("show"), 6000);
}



async function recordGameResult({ won = false, scoreDelta = 0 } = {}) {
  if (!currentUser) {
    console.warn("recordGameResult: no logged-in user, skipping save.");
    return { error: "no-user" };
  }

  const updates = {};

  if (won) {
    currentGamesWon = (currentGamesWon || 0) + 1;
    updates.games_won = currentGamesWon;
  }

  if (scoreDelta) {
    currentBrainScore = (currentBrainScore || 0) + scoreDelta;
    updates.brain_score = currentBrainScore;
  }

  if (Object.keys(updates).length === 0) return { skipped: true };

  const { error } = await supabaseClient
    .from("profiles")
    .update(updates)
    .eq("id", currentUser.id);

  if (error) {
    console.error("recordGameResult: failed to save stats:", error);
    return { error };
  }

  applyTranslations(currentLang);
  return { success: true, games_won: currentGamesWon, brain_score: currentBrainScore };
}

window.recordGameResult = recordGameResult;

function renderHistory(){
  const list = document.getElementById('historyList');
  if(!list) return;
  const t = i18n[currentLang];
  list.textContent = '';

  const note = (text) => {
    const d = document.createElement('div');
    d.className = 'history-empty';
    d.textContent = text;
    list.appendChild(d);
  };

  if(historyState === 'loading') return note(t.historyLoading);
  if(historyState === 'error'){
    note(t.historyFailed);
    if(historyError){
      const d = document.createElement('div');
      d.className = 'history-empty';
      d.style.cssText = 'font-size:12px;direction:ltr;padding-top:0';
      d.textContent = historyError;
      list.appendChild(d);
    }
    return;
  }
  if(!historyRows.length) return note(t.historyEmpty);

  const locale = currentLang === 'ar' ? 'ar-u-ca-gregory' : 'en-GB';
  historyRows.forEach(row => {
    const result = ['win','loss','tie'].includes(row.result) ? row.result : 'tie';

    const item = document.createElement('div');
    item.className = 'history-item ' + result;

    const badge = document.createElement('span');
    badge.className = 'history-badge';
    badge.textContent = t[result];

    const meta = document.createElement('div');
    meta.className = 'history-meta';
    const opp = document.createElement('div');
    opp.className = 'history-opp';
    const oppName = row.opponent_name || t.unknownOpponent;
    opp.textContent = `${t.vs} ${oppName}`;
    opp.title = oppName;
    const date = document.createElement('div');
    date.className = 'history-date';
    date.textContent = row.created_at
      ? new Date(row.created_at).toLocaleDateString(locale, { day:'numeric', month:'short', year:'numeric' })
      : '';
    meta.append(opp, date);

    const score = document.createElement('div');
    score.className = 'history-score';
    score.textContent = `${row.my_score ?? 0} - ${row.opponent_score ?? 0}`;

    item.append(badge, meta, score);
    list.appendChild(item);
  });
}

async function loadHistory(){
  historyState = 'loading';
  historyError = '';
  renderHistory();
  try{
    const { data, error } = await supabaseClient
      .from('match_history')
      .select('opponent_name, my_score, opponent_score, result, created_at')
      .eq('user_id', viewedUserId)
      .order('created_at', { ascending: false })
      .limit(30);

    if(error){
      console.error('Load history error:', error);
      historyState = 'error';
      historyError = error.message || String(error);
    }else{
      historyRows = data || [];
      historyState = 'ready';
    }
  }catch(e){
    console.error('Load history exception:', e);
    historyState = 'error';
    historyError = (e && e.message) || String(e);
  }
  renderHistory();
}

async function initProfile() {
  const usernameEl = document.getElementById("profileUsername");

  const { data, error } = await supabaseClient.auth.getUser();

  if (error || !data.user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = data.user;

  const params = new URLSearchParams(window.location.search);
  viewedUserId = params.get("id") || currentUser.id;
  isOwnProfile = viewedUserId === currentUser.id;
  loadHistory();

  if (!isOwnProfile){
    profileImageWrap.classList.add("readonly");
    profileImageWrap.title = "";
    aboutBox.title = "";
    document.querySelector(".save-row").style.display = "none";
  }

  const { data: profileRow, error: profileError } = await supabaseClient
    .from("profiles")
    .select("fullname, about, avatar_url, games_won, brain_score")
    .eq("id", viewedUserId)
    .maybeSingle();

  if(profileError) console.error("Load profile error:", profileError);

  const username =
    profileRow?.fullname ||
    (isOwnProfile ? (currentUser.user_metadata?.fullname ||
      currentUser.user_metadata?.full_name ||
      currentUser.email?.split("@")[0]) : null) ||
    "User";

  usernameEl.textContent = username;

  if(profileRow?.about){
    currentAboutText = profileRow.about;
    aboutBox.textContent = profileRow.about;
  } else if (!isOwnProfile){
    aboutBox.textContent = "";
  }
  if(profileRow?.avatar_url){
    profileImg.src = profileRow.avatar_url;
  }

  currentGamesWon = profileRow?.games_won ?? 0;
  currentBrainScore = profileRow?.brain_score ?? 0;
  applyTranslations(currentLang);
}

initProfile();
applyTranslations(currentLang);
</script>
