<script src="auth.js"></script>
<script>

const i18n = {
  ar: {
    backBtn: "رجوع",
    TtlLogin: "تسجيل الدخول",
    SubTtl: "سجّل دخولك للمتابعة إلى Brain Battle",
    UsernameText: "اسم المستخدم أو البريد الإلكتروني",
    PasswordText: "كلمة المرور",
    UserPlaceholder: "اكتب اسمك أو بريدك",
    PassPlaceholder: "••••••••",
    showPassword: "إظهار كلمة المرور",
    hidePassword: "إخفاء كلمة المرور",
    capsLock: "تنبيه: Caps Lock مفعّل",
    errorMsg: "يرجى تعبئة جميع الحقول بشكل صحيح",
    SubmitBtn: "دخول",
    loggingIn: "جارٍ تسجيل الدخول",
    FooterLink: "ليس لديك حساب؟ <a href=\"signup.html\">أنشئ حسابًا جديدًا</a>",
    usernameNotFound: "اسم المستخدم غير موجود",
    emailNotConfirmed: "لازم تأكد إيميلك أول. <a href=\"verify.html\">أدخل الكود اللي وصلك</a>",
    wrongPassword: "كلمة المرور غير صحيحة",
    invalidCredentials: "الإيميل أو كلمة المرور غير صحيحة",
    tooManyAttempts: "محاولات كثيرة، انتظر شوي وحاول مرة ثانية",
    networkError: "تعذّر الاتصال، تأكد من الإنترنت وحاول مرة ثانية",
    loginFailed: "تعذّر تسجيل الدخول، حاول مرة ثانية",
    usernameLoginOff: "الدخول باسم المستخدم مو متاح الحين، سجّل دخولك بإيميلك",
  },
  en: {
    backBtn: "Back",
    TtlLogin: "Login",
    SubTtl: "Log in to continue to Brain Battle",
    UsernameText: "Username or Email",
    PasswordText: "Password",
    UserPlaceholder: "Enter your username or email",
    PassPlaceholder: "••••••••",
    showPassword: "Show password",
    hidePassword: "Hide password",
    capsLock: "Heads up: Caps Lock is on",
    errorMsg: "Please fill in all fields correctly",
    SubmitBtn: "Login",
    loggingIn: "Logging in",
    FooterLink: "Don't have an account? <a href=\"signup.html\">Create a new account</a>",
    usernameNotFound: "Username not found",
    emailNotConfirmed: "Please confirm your email first. <a href=\"verify.html\">Enter the code we sent you</a>",
    wrongPassword: "Wrong password",
    invalidCredentials: "Wrong email or password",
    tooManyAttempts: "Too many attempts. Wait a moment and try again.",
    networkError: "Couldn't connect. Check your internet and try again.",
    loginFailed: "Couldn't log in. Please try again.",
    usernameLoginOff: "Logging in with a username isn't available right now. Use your email instead.",
  }
};

function applyTranslations(l) {
  document.documentElement.lang = l;
  document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
  const t = i18n[l];
  document.title = t.TtlLogin + ' — Brain Battle';
  document.getElementById('backBtn').textContent = t.backBtn;
  document.getElementById('TtlLogin').textContent = t.TtlLogin;
  document.getElementById('SubTtl').textContent = t.SubTtl;
  document.getElementById('UsernameText').textContent = t.UsernameText;
  document.getElementById('PasswordText').textContent = t.PasswordText;
  document.getElementById('username').placeholder = t.UserPlaceholder;
  document.getElementById('password').placeholder = t.PassPlaceholder;
  document.getElementById('CapsHint').textContent = t.capsLock;
  document.getElementById('errorMsg').textContent = t.errorMsg;
  document.getElementById('SubmitBtn').textContent = t.SubmitBtn;
  document.getElementById('FooterLink').innerHTML = t.FooterLink;
  setPasswordToggleLabels(t.showPassword, t.hidePassword);
}

// Username login runs on the server (Supabase function "login-with-username"),
// so nobody's email is ever sent to the browser. Returns {} on success or { error, email? }.
async function loginWithUsername(username, password) {
    const { data, error } = await supabaseClient.functions.invoke('login-with-username', {
        body: { username, password }
    });
    if (error) {
        // Our function answers with { error: "..." }; anything else (not deployed yet, network) counts as unavailable.
        const body = error.context && typeof error.context.json === 'function'
            ? await error.context.json().catch(() => ({}))
            : {};
        return body.error ? { error: body.error, email: body.email } : { error: 'unavailable' };
    }
    if (!data || !data.access_token) return { error: 'unavailable' };
    const { error: sessionError } = await supabaseClient.auth.setSession({
        access_token: data.access_token,
        refresh_token: data.refresh_token
    });
    return sessionError ? { error: 'unavailable' } : {};
}

function showNotConfirmed(email, lang) {
    if (email) sessionStorage.setItem('bb_pending_user', JSON.stringify({ email }));
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.innerHTML = i18n[lang].emailNotConfirmed;
    errorMsg.style.display = 'block';
}

// Turns a Supabase signInWithPassword error into one of our translated messages.
function friendlyAuthError(error, t) {
    const msg = error.message || '';
    if (error.code === 'invalid_credentials' || /invalid login credentials/i.test(msg)) return t.invalidCredentials;
    if (error.status === 429 || /rate limit|too many/i.test(msg)) return t.tooManyAttempts;
    if (error.name === 'AuthRetryableFetchError' || /failed to fetch|network/i.test(msg)) return t.networkError;
    return t.loginFailed;
}

let loginInFlight = false;

async function handleLogin(e) {
    e.preventDefault();
    if (loginInFlight) return false;

    // Only the identifier is trimmed: spaces in a password are part of the password.
    const usernameOrEmail = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('SubmitBtn');
    const lang = localStorage.getItem('lang') || 'en';
    const t = i18n[lang];

    const showError = text => {
        errorMsg.textContent = text;
        errorMsg.style.display = 'block';
    };

    errorMsg.style.display = 'none';

    if (!usernameOrEmail || !password) {
        showError(t.errorMsg);
        document.getElementById(usernameOrEmail ? 'password' : 'username').focus();
        return false;
    }

    loginInFlight = true;
    setBusy(submitBtn, true, t.loggingIn);
    const done = () => {
        loginInFlight = false;
        setBusy(submitBtn, false, t.SubmitBtn);
    };

    try {
        if (!usernameOrEmail.includes('@')) {
            const result = await loginWithUsername(usernameOrEmail, password);
            if (!result.error) {
                window.location.href = 'index.html';
                return false;
            }
            done();
            if (result.error === 'email_not_confirmed') {
                showNotConfirmed(result.email, lang);
                return false;
            }
            const messages = {
                username_not_found: t.usernameNotFound,
                invalid_credentials: t.wrongPassword,
                too_many_attempts: t.tooManyAttempts,
            };
            showError(messages[result.error] || t.usernameLoginOff);
            return false;
        }

        const email = usernameOrEmail;
        const { error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            done();
            // Signed up but never entered the emailed code: point them to the code page (it can resend the code).
            if (error.code === 'email_not_confirmed' || /not confirmed/i.test(error.message)) {
                showNotConfirmed(email, lang);
                return false;
            }
            showError(friendlyAuthError(error, t));
            return false;
        }

        window.location.href = 'index.html';
    } catch (err) {
        console.error(err);
        done();
        showError(t.networkError);
    }
    return false;
}

initPasswordToggles();
watchCapsLock([document.getElementById('password')], 'CapsHint');
applyTranslations(localStorage.getItem('lang') || 'en');
</script>

</body>
