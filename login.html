<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول — Brain Battle</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #f4f6f9;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .top-header {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 9999;
    }

    .back-btn {
        background-color: #e2e8f0;
        color: #1e293b;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: bold;
        text-decoration: none;
        display: inline-block;
    }

    .back-btn:hover {
        background-color: #cbd5e1;
    }

    .login-wrapper {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .login-card {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 400px;
    }

    .login-card h2 {
        color: #1e293b;
        margin-bottom: 8px;
        font-size: 24px;
    }

    .subtitle {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 24px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-size: 14px;
        font-weight: 500;
    }

    .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
    }

    .input-group input:focus {
        border-color: #2563eb;
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-top: 4px;
    }

    .btn-submit:hover {
        background-color: #1d4ed8;
    }

    .error-msg {
        color: #dc2626;
        font-size: 13px;
        margin-top: -12px;
        margin-bottom: 16px;
        display: none;
    }

    .footer-link {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #64748b;
    }

    .footer-link a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
    }
</style>
</head>
<body>

<header class="top-header">
    <a href="Fk it.html" class="back-btn">رجوع</a>
</header>

<div class="login-wrapper">
    <div class="login-card">
        <h2>🧠 تسجيل الدخول</h2>
        <p class="subtitle">سجّل دخولك للمتابعة إلى Brain Battle</p>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="input-group">
                <label for="username">اسم المستخدم أو البريد الإلكتروني</label>
                <input type="text" id="username" placeholder="اكتب اسمك أو بريدك" required>
            </div>

            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="error-msg" id="errorMsg">يرجى تعبئة جميع الحقول بشكل صحيح</div>

            <button type="submit" class="btn-submit">دخول</button>
        </form>

        <div class="footer-link">
            ليس لديك حساب؟ <a href="signup.html">أنشئ حسابًا جديدًا</a>
        </div>
    </div>
</div>

<script>
function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('errorMsg');

    if (!username || !password) {
        errorMsg.style.display = 'block';
        return false;
    }

    errorMsg.style.display = 'none';
    alert('تم تسجيل الدخول باسم: ' + username);
    return false;
}
</script>

</body>
</html>
