<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #f4f6f9;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .top-header {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 9999;
    }

    .back-btn {
        background-color: #e2e8f0;
        color: #1e293b;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: bold;
        text-decoration: none;
        display: inline-block;
    }

    .back-btn:hover {
        background-color: #cbd5e1;
    }

    .login-wrapper {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .login-card {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 400px;
    }

    .login-card h2 {
        color: #1e293b;
        margin-bottom: 8px;
        font-size: 24px;
    }

    .subtitle {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 24px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-size: 14px;
        font-weight: 500;
    }

    .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
    }

    .input-group input:focus {
        border-color: #2563eb;
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-top: 4px;
    }

    .btn-submit:hover {
        background-color: #1d4ed8;
    }

    .error-msg {
        color: #dc2626;
        font-size: 13px;
        margin-top: -12px;
        margin-bottom: 16px;
        display: none;
    }

    .footer-link {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #64748b;
    }

    .footer-link a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
    }
</style>
</head>
<body>

<header class="top-header">
    <a href="index.html" class="back-btn" id="backBtn">رجوع</a>
</header>

<div class="login-wrapper">
    <div class="login-card">
        <h2 id="TtlLogin">🧠 تسجيل الدخول</h2>
        <p class="subtitle" id="SubTtl">سجّل دخولك للمتابعة إلى Brain Battle</p>

        <form id="loginForm" onsubmit="handleLogin(event); return false;">
            <div class="input-group">
                <label for="username" id="UsernameText">اسم المستخدم أو البريد الإلكتروني</label>
                <input type="text" id="username" placeholder="اكتب اسمك أو بريدك" required>
            </div>

            <div class="input-group">
                <label for="password" id="PasswordText">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="error-msg" id="errorMsg">يرجى تعبئة جميع الحقول بشكل صحيح</div>

            <button type="submit" class="btn-submit" id="SubmitBtn">دخول</button>
        </form>

        <div class="footer-link" id="FooterLink">
            ليس لديك حساب؟ <a href="signup.html">أنشئ حسابًا جديدًا</a>
        </div>
    </div>
</div>

<script>

const i18n = {
  ar: {
    backBtn: "رجوع",
    TtlLogin: "🧠 تسجيل الدخول",
    SubTtl: "سجّل دخولك للمتابعة إلى Brain Battle",
    UsernameText: "اسم المستخدم أو البريد الإلكتروني",
    PasswordText: "كلمة المرور",
    UserPlaceholder: "اكتب اسمك أو بريدك",
    PassPlaceholder: "••••••••",
    errorMsg: "يرجى تعبئة جميع الحقول بشكل صحيح",
    SubmitBtn: "دخول",
    FooterLink: "ليس لديك حساب؟ <a href=\"signup.html\">أنشئ حسابًا جديدًا</a>",
    usernameNotFound: "اسم المستخدم غير موجود",
  },
  en: {
    backBtn: "Back",
    TtlLogin: "🧠 Login",
    SubTtl: "Log in to continue to Brain Battle",
    UsernameText: "Username or Email",
    PasswordText: "Password",
    UserPlaceholder: "Enter your username or email",
    PassPlaceholder: "••••••••",
    errorMsg: "Please fill in all fields correctly",
    SubmitBtn: "Login",
    FooterLink: "Don't have an account? <a href=\"signup.html\">Create a new account</a>",
    usernameNotFound: "Username not found",
  }
};

function applyTranslations(l) {
  document.documentElement.lang = l;
  document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
  const t = i18n[l];
  document.getElementById('backBtn').textContent = t.backBtn;
  document.getElementById('TtlLogin').textContent = t.TtlLogin;
  document.getElementById('SubTtl').textContent = t.SubTtl;
  document.getElementById('UsernameText').textContent = t.UsernameText;
  document.getElementById('PasswordText').textContent = t.PasswordText;
  document.getElementById('username').placeholder = t.UserPlaceholder;
  document.getElementById('password').placeholder = t.PassPlaceholder;
  document.getElementById('errorMsg').textContent = t.errorMsg;
  document.getElementById('SubmitBtn').textContent = t.SubmitBtn;
  document.getElementById('FooterLink').innerHTML = t.FooterLink;
}

async function handleLogin(e) {
    e.preventDefault();

    const usernameOrEmail = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    const lang = localStorage.getItem('lang') || 'en';

    errorMsg.style.display = 'none';

    if (!usernameOrEmail || !password) {
        errorMsg.textContent = i18n[lang].errorMsg;
        errorMsg.style.display = 'block';
        return false;
    }

    let email = usernameOrEmail;

    if (!usernameOrEmail.includes('@')) {
        const { data, error } = await supabaseClient
            .rpc('get_email_by_fullname', {
                input_fullname: usernameOrEmail
            });

        if (error) {
            errorMsg.textContent = error.message;
            errorMsg.style.display = 'block';
            return false;
        }

        if (!data) {
            errorMsg.textContent = i18n[lang].usernameNotFound;
            errorMsg.style.display = 'block';
            return false;
        }

        email = data;
    }

    const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        errorMsg.textContent = error.message;
        errorMsg.style.display = 'block';
        return false;
    }

    errorMsg.style.display = 'none';
    window.location.href = 'index.html';
    return false;
}
applyTranslations(localStorage.getItem('lang') || 'en');
</script>

</body>
</html>
